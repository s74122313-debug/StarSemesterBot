<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Star Upgrader</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#0b0b12;--bg2:#13131d;--bg3:#1b1b29;--line:#262637;--tx:#f2f3f8;--mut:#8b8ea6;--ac:#7c5cff;--ac2:#4f8cff;--gold:#ffd24a;--ok:#3ddc84;--bad:#ff4d6a;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
svg.st{width:1em;height:1em;vertical-align:-.14em;display:inline-block}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;background:var(--bg)}
/* header */
header{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(#10101a,#0b0b12);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.5px;font-size:15px;line-height:1.05;display:flex;align-items:center;gap:7px}
.logo b{background:linear-gradient(90deg,#ffd24a,#ff9f1c);-webkit-background-clip:text;color:transparent}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#7c5cff,#4f8cff);display:grid;place-items:center;font-style:normal;font-size:15px}
.bal{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800;font-size:15px}
.bal .st{font-size:17px}
.avb{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#2a2a40,#1b1b29);border:1px solid var(--line);display:grid;place-items:center}
.avb svg{width:20px;height:20px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 18px;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
/* bottom nav */
nav{height:var(--nav);flex:none;display:flex;background:#0f0f18;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:700;position:relative;transition:.15s}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
nav button.on::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#7c5cff,#4f8cff)}
nav button.on svg{stroke:#a99bff}
nav .dot{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
/* generic */
h2{font-size:19px;font-weight:900;margin:2px 0 10px;display:flex;align-items:center;gap:8px}
h3{font-size:14px;font-weight:800;margin:14px 0 8px;color:#cfd2e6}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)}.sm{font-size:12px}
.btn{padding:13px 16px;border-radius:14px;font-weight:800;font-size:15px;background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;text-align:center;box-shadow:0 6px 18px rgba(92,100,255,.28);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#ffd24a,#ff9f1c);color:#2a1a00;box-shadow:0 6px 18px rgba(255,170,30,.28)}
.btn.ghost{background:var(--bg3);box-shadow:none;border:1px solid var(--line)}
.btn.red{background:linear-gradient(135deg,#ff4d6a,#c2304f);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#3ddc84,#19b36b);color:#04210f;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 -12px;padding-left:12px;padding-right:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:13px;font-weight:700;color:#b9bcd4}
.chip.on{background:linear-gradient(135deg,#7c5cff,#4f8cff);color:#fff;border-color:transparent}
.search{width:100%;padding:11px 14px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);outline:0;font-size:15px;margin-bottom:9px}
/* NFT card */
.nft{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;width:100%}
.nft .pat{position:absolute;inset:0}
.nft .art{position:absolute;inset:10% 10% 6%;width:80%;height:84%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.rib{position:absolute;top:0;right:0;width:100%;height:100%;pointer-events:none}
.rib{--rc:#444}
.rib::after{content:attr(data-t)}
.nft .rib{display:block}
.nft .rib{font-size:0}
.nft .rib::before{content:"";position:absolute;top:0;right:0;width:62%;height:26%;background:var(--rc);clip-path:polygon(24% 0,100% 0,100% 100%,0 100%);opacity:.0}
.nft{container-type:inline-size}
.nft .rib{position:absolute;top:0;right:0;left:auto;width:auto;height:auto;padding:3cqw 5cqw 3cqw 9cqw;font-size:9.5cqw;font-weight:800;color:#fff;background:var(--rc);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);white-space:nowrap;border-bottom-left-radius:0;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.nft .rib::before,.nft .rib::after{display:none}
.nft .num{position:absolute;left:0;bottom:0;padding:2.5cqw 6cqw;font-size:9cqw;font-weight:800;background:rgba(0,0,0,.45);border-top-right-radius:10px;color:#fff}
/* item cell (inventory etc.) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.cell{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:5px 5px 7px;text-align:center}
.cell.sel{border-color:#7c5cff;box-shadow:0 0 0 2px #7c5cff inset}
.cell .nm{font-size:11.5px;font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .pr{font-size:12px;font-weight:800;color:var(--gold);display:flex;justify-content:center;align-items:center;gap:3px}
.cell .pc{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);font-size:10px;padding:2px 6px;border-radius:7px;font-weight:800;z-index:2}
.cell .tk{position:absolute;right:8px;bottom:40px;background:#7c5cff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;z-index:2}
/* case cards */
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cc{position:relative;background:linear-gradient(180deg,var(--bg2),#0f0f17);border:1px solid var(--line);border-radius:18px;padding:10px 8px 11px;text-align:center;overflow:hidden}
.cc:active{transform:scale(.98)}
.cc .cn{font-size:13px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .cp{margin-top:5px;display:inline-flex;gap:5px;align-items:center;background:var(--bg3);border-radius:999px;padding:5px 12px;font-weight:900;font-size:14px}
.cc .tg{position:absolute;top:8px;left:8px;font-size:10px;font-weight:900;padding:3px 8px;border-radius:7px;background:var(--bad);z-index:3}
.cc .tg.free{background:var(--ok);color:#04210f}
.crate{position:relative;width:78%;margin:0 auto;aspect-ratio:1.1}
.crate .box{width:100%;height:100%;position:relative;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.crate .glow{position:absolute;inset:-10%;background:radial-gradient(circle,var(--cc) 0%,transparent 62%);opacity:.5;filter:blur(8px)}
.crate .emb{position:absolute;left:50%;top:6%;width:42%;transform:translateX(-50%);z-index:2;pointer-events:none}
.crate .emb svg{width:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.crate.big{width:56%}
/* live feed */
.feed{display:flex;gap:8px;overflow:hidden;margin:0 -12px 12px;padding:0 12px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.fd{flex:none;width:62px;position:relative}
.fd .nft{border-radius:11px}
.fd .nft .rib{display:none}
.fd .u{font-size:9px;color:var(--mut);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* modal sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,5,10,.78);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
.sheet{width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));animation:su .22s ease-out;position:relative}
.sheet::-webkit-scrollbar{display:none}
.sheet .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:18px;z-index:5}
.sheet h1{font-size:20px;font-weight:900;text-align:center;margin:4px 30px 2px}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px);opacity:.4}}
.qty{display:flex;gap:6px;margin:10px 0}
.qty button{flex:1;padding:10px 0;border-radius:12px;background:var(--bg3);border:1px solid var(--line);font-weight:900;font-size:15px}
.qty button.on{background:linear-gradient(135deg,#7c5cff,#4f8cff);border-color:transparent}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.odds .cell{padding:4px}
.odds .cell .pr{font-size:11px}
.odds .ch{font-size:10.5px;color:var(--mut);font-weight:700}
.tgl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#c3c6dd}
.sw{width:42px;height:24px;border-radius:99px;background:#2a2a3d;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:#7c5cff}.sw.on::after{left:21px}
/* ===== FULLSCREEN OPENING ===== */
#open{position:fixed;inset:0;z-index:100;background:#07070d;display:flex;flex-direction:column;overflow:hidden}
#open .bgg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--cc) 0%,transparent 58%);opacity:.35;animation:pulse 3s infinite alternate}
@keyframes pulse{to{opacity:.5;transform:scale(1.08)}}
#open .top{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top))}
#open .top b{font-size:17px;font-weight:900}
#open .top .cl{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:19px}
#open .stage{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 8px}
#open .bot{position:relative;z-index:3;padding:12px 14px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
#open .bot .btn{flex:1}
/* horizontal reel (x1) */
.hreel{position:relative;width:100%;overflow:hidden;height:min(64vw,300px);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.hreel .track{position:absolute;left:0;top:0;height:100%;display:flex;gap:10px;will-change:transform}
.hreel .it{flex:none;height:100%;aspect-ratio:1}
.ptr{position:absolute;left:50%;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:linear-gradient(#fff,#ffd24a);border-radius:3px;box-shadow:0 0 14px 3px rgba(255,210,74,.8);z-index:4}
.ptr::before,.ptr::after{content:"";position:absolute;left:-7px;border:9px solid transparent}
.ptr::before{top:-2px;border-top-color:#ffd24a}.ptr::after{bottom:-2px;border-bottom-color:#ffd24a}
/* vertical reels (x2..x10) */
.vgrid{display:grid;width:100%;height:100%;gap:8px;padding:6px 0}
.vr{position:relative;overflow:hidden;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.vr .track{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;gap:6px;padding:0 5px;will-change:transform}
.vr .it{flex:none;width:100%}
.vr .ln{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:linear-gradient(90deg,transparent,#ffd24a,transparent);box-shadow:0 0 12px 2px rgba(255,210,74,.85);z-index:4}
.vr.win{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,74,.35)}
/* reveal / results */
.rev{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;background:rgba(7,7,13,.82);animation:fi .3s}
.rev .big{width:min(66vw,300px);animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
.rev .big .nft{box-shadow:0 0 50px 6px var(--rg);border-radius:22px}
.rev h1{font-size:22px;font-weight:900;text-align:center}
.rev .tier{font-size:13px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.rev .rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 8deg,transparent 8deg 20deg);animation:spin 22s linear infinite;mask-image:radial-gradient(circle,#000 0,transparent 45%);z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.rres{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:rgba(7,7,13,.9);animation:fi .3s;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.rres .list{flex:1;overflow-y:auto;margin:8px 0}
.rres .tot{text-align:center;font-weight:900;font-size:17px}
.flashf{position:absolute;inset:0;z-index:5;background:#fff;pointer-events:none;animation:fl .7s forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.parts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.parts i{position:absolute;width:8px;height:8px;border-radius:2px;animation:pf 1.3s ease-out forwards}
@keyframes pf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
/* upgrader */
.up-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{background:var(--bg2);border:2px dashed #34344c;border-radius:18px;min-height:150px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;position:relative}
.slot .plus{width:46px;height:46px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-size:26px;color:var(--mut)}
.slot .nft{width:84%}
.wheelw{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:12px auto}
.wheelw svg{width:100%;height:100%}
.wheelw .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.wheelw .mid b{font-size:36px}
.rot{transition:transform 4.6s cubic-bezier(.12,.7,.1,1);transform-origin:50% 50%}
.bet{display:flex;gap:6px;margin:8px 0}
.bet input{flex:1;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);outline:0;font-weight:800}
/* misc */
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#22223a;border:1px solid #3a3a5e;padding:11px 18px;border-radius:14px;font-weight:800;font-size:14px;z-index:200;max-width:88vw;text-align:center;animation:ti 2.4s forwards;pointer-events:none}
@keyframes ti{0%{opacity:0;transform:translate(-50%,-14px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.prog{height:9px;background:var(--bg3);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#4f8cff);border-radius:9px}
.list>*+*{margin-top:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat .card{text-align:center}.stat b{display:block;font-size:19px;font-weight:900}.stat span{font-size:12px;color:var(--mut)}
.pass{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.pass.cur{border-color:#7c5cff}
.pass .lv{width:42px;height:42px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-weight:900}
.pass .mini{width:46px}
.coin{width:150px;height:150px;margin:14px auto;position:relative;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.2,.8,.2,1)}
.coin div{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:60px;backface-visibility:hidden;border:5px solid #c98a10;background:radial-gradient(circle at 35% 30%,#ffe58a,#d99a14)}
.coin .b{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#d6e2ff,#8a9ccf);border-color:#6b7a9f}
.react{height:200px;border-radius:20px;display:grid;place-items:center;font-size:24px;font-weight:900;text-align:center}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem div{aspect-ratio:1;border-radius:13px;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;font-size:30px}
.mem div.f{background:#2a2a48}
.sheet .nft.sm{width:90px}
.hi{animation:hi .5s}@keyframes hi{from{transform:scale(1.2)}}
.empty{text-align:center;color:var(--mut);padding:36px 10px}

.vr .rib{display:none}
#open .bot .btn,.rres .btn{font-size:14px;padding:13px 6px;white-space:nowrap}
.bet input{min-width:0}.bet .btn{flex:none;padding:8px 10px}
</style></head>
<body><div id="app"></div>
<script>// ===== colour helpers
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(h,t,k){const a=hex2rgb(h),b=hex2rgb(t);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
const lite=(h,k)=>mix(h,'#ffffff',k), dark=(h,k)=>mix(h,'#000000',k);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function starPts(cx,cy,R,r,n=5){let p=[];for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;p.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1))}return p.join(' ')}

// ===== 32 original 3D-ish gift models, viewBox 0 0 100 100
// each: (P,c) -> svg inner. P = unique id prefix, c = colourway hex
const GOLD=['#ffe58a','#d99a14'];
function gdef(P,c){
  const L=(n,a,b,x1=0,y1=0,x2=1,y2=1)=>`<linearGradient id="${P}${n}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  return '<defs>'+L('m',lite(c,.3),dark(c,.28))+L('g',GOLD[0],GOLD[1])+L('w','#ffffff','#c9d3e6')+L('d',lite(c,.1),dark(c,.55))+'</defs>';
}
const SH='<ellipse cx="50" cy="93" rx="28" ry="4" fill="#000" opacity=".28"/>';
const HI=(d)=>`<path d="${d}" stroke="#fff" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round"/>`;
const MODELS=[

function solveW(pool,target){
  // weights ~ price^-a ; bisection so EV = target
  const ev=a=>{let s=0,w=0;pool.forEach(i=>{const x=Math.pow(ITEMS[i].price,-a);s+=x*ITEMS[i].price;w+=x});return s/w};
  let lo=-4,hi=10;
  if(ev(-4)<=target)return -4;
  if(ev(10)>=target)return 10;
  for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(ev(mid)>target)lo=mid;else hi=mid}
  return (lo+hi)/2;
}
const CASES=[];
function mkCase(o){
  const pool=o.pool;
  const a=solveW(pool,o.price*o.rtp);
  const w=pool.map(i=>Math.pow(ITEMS[i].price,-a));
  const sum=w.reduce((x,y)=>x+y,0);
  const p=w.map(x=>x/sum);
  const ev=pool.reduce((s,i,k)=>s+ITEMS[i].price*p[k],0);
  const c={id:CASES.length,name:o.name,price:o.price,col:o.col,em:o.em,pool,p,ev,tag:o.tag||'',top:Math.max(...pool.map(i=>ITEMS[i].price))};
  CASES.push(c);return c;
}

    });
  });
})();

// ===== CASE MODAL
let QTY=1;
function caseModal(id){
  const c=CASES[id];const free=c.price===0;if(free)QTY=1;
  const items=c.pool.map((i,k)=>({i,p:c.p[k]})).sort((a,b)=>ITEMS[b.i].price-ITEMS[a.i].price);
  const el=sheet('');
  const body=()=>{
    const left=Math.max(0,S.freeAt-Date.now());
    const cost=c.price*QTY;
    el.querySelector('.sheet').innerHTML=`<button class="x">✕</button><h1>${c.name}</h1><div style="margin:6px 0">${crateHTML(c,1)}</div>
    <div class="row sm mut" style="justify-content:center;gap:16px"><span>Предметов: <b style="color:#fff">${c.pool.length}</b></span><span>Макс: <b style="color:var(--gold)">${fmt(c.top)}</b> ${STAR}</span></div>
    ${free?'':`<div class="qty">${[1,2,3,5,10].map(q=>`<button data-q="${q}" class="${q===QTY?'on':''}">×${q}</button>`).join('')}</div>`}
    <div class="row" style="margin:8px 0 4px"><label class="tgl" id="fastt"><span class="sw ${S.fast?'on':''}"></span>Быстрое открытие</label></div>
    <button class="btn ${free?'green':'gold'}" id="obtn" style="width:100%;margin:8px 0">${free?(left>0?'Следующий через '+fmtT(left):'Открыть бесплатно'):`Открыть ×${QTY} · ${fmt(cost)} ★`}</button>
    <h3>Что внутри</h3><div class="odds">${items.map(({i,p})=>{const it=ITEMS[i];return `<div class="cell">${nftHTML(it)}<div class="nm">${it.name}</div><div class="pr">${STAR}${fmt(it.price)}</div><div class="ch" style="color:${TIERS[it.r].c}">${p>=.01?(p*100).toFixed(1):(p*100).toFixed(3)}%</div></div>`}).join('')}</div>`;
    el.querySelector('.x').onclick=el.close;
    const qb=el.querySelector('.qty');if(qb)qb.onclick=e=>{const b=e.target.closest('button');if(b){QTY=+b.dataset.q;sfx('click');body()}};
    el.querySelector('#fastt').onclick=()=>{S.fast=!S.fast;save();body()};
    el.querySelector('#obtn').onclick=()=>{if(free&&left>0)return toast('Бесплатный кейс ещё не готов');if(S.stars<cost)return toast('Не хватает звёзд');el.close();startOpen(c,free?1:QTY)};
  };
  body();
}
function fmtT(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}ч ${m}м`:`${m}м ${s%60}с`}

// ===== OPENING (fullscreen)
function rollCase(c){let r=Math.random(),a=0;for(let k=0;k<c.pool.length;k++){a+=c.p[k];if(r<a)return c.pool[k]}return c.pool[c.pool.length-1]}
function startOpen(c,q){
  const cost=c.price*q;addStars(-cost);S.st.spent+=cost;
  if(c.price===0)S.freeAt=Date.now()+8*3600e3;
  const got=[];for(let i=0;i<q;i++)got.push(giveItem(rollCase(c)));
  S.opened+=q;addXp(q*Math.min(120,Math.round(10+Math.sqrt(c.price))));qAdd('open',q);save();
  showOpening(c,got);
}
function burst(parent,color,n=46){
  const b=document.createElement('div');b.className='parts';
  for(let i=0;i<n;i++){const e=document.createElement('i');const a=Math.random()*Math.PI*2,d=80+Math.random()*220;
    e.style.cssText=`left:50%;top:50%;background:${i%3?color:'#fff'};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d+60}px;animation-delay:${Math.random()*.15}s`;b.appendChild(e)}
  parent.appendChild(b);setTimeout(()=>b.remove(),1700);
}
function stripPick(c){return Math.random()<.55?ITEMS[rollCase(c)]:ITEMS[pick(c.pool)]}
function closeOpen(){const o=$('#open');if(o)o.remove();go(CUR)}
function showOpening(c,got){
  const q=got.length;
  const o=document.createElement('div');o.id='open';o.style.setProperty('--cc',c.col);
  o.innerHTML=`<div class="bgg"></div><div class="top"><b>${c.name}</b><span class="mut">×${q}</span><button class="cl" id="ocl">✕</button></div><div class="stage" id="stg"></div><div class="bot" id="obot"><button class="btn ghost" id="oskip">Пропустить</button></div>`;
  document.body.appendChild(o);
  let done=false,skipFn=null;
  const fast=S.fast;
  const finish=()=>{if(done)return;done=true;q===1?revealOne(c,got[0],o):showResults(c,got,o)};
  $('#oskip').onclick=$('#ocl').onclick=()=>{if(done){closeOpen();return}skipFn&&skipFn();finish()};
  const stg=$('#stg');
  if(q===1){
    stg.innerHTML=`<div class="hreel" id="hr"><div class="track" id="tr"></div><div class="ptr"></div></div>`;
    const hr=$('#hr'),tr=$('#tr');const s=hr.clientHeight,step=s+10,W=hr.clientWidth,WIN=48,N=58;
    let h='';for(let i=0;i<N;i++){const it=i===WIN?ITEMS[got[0].id]:stripPick(c);h+=`<div class="it" style="width:${s}px">${nftHTML(it)}</div>`}
    tr.innerHTML=h;
    const jit=(Math.random()-.5)*s*.6,end=-(WIN*step+s/2-W/2+jit);
    const dur=fast?1.1:6.2;
    tr.getBoundingClientRect();
    tr.style.transition=`transform ${dur}s cubic-bezier(.07,.5,.1,1)`;tr.style.transform=`translateX(${end}px)`;
    let last=-1,stop=false;
    const loop=()=>{if(stop||done)return;try{const x=new DOMMatrix(getComputedStyle(tr).transform).m41;const idx=Math.floor((-x+W/2)/step);if(idx!==last){last=idx;sfx('tick',(idx%5)*30);haptic('light')}}catch(e){}requestAnimationFrame(loop)};loop();
    skipFn=()=>{stop=true;tr.style.transition='none';tr.style.transform=`translateX(${end}px)`};
    setTimeout(()=>{stop=true;finish()},dur*1000+250);
  }else{
    const cols=q<=5?q:5,rows=Math.ceil(q/cols);
    stg.innerHTML=`<div class="vgrid" id="vg" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${got.map(()=>`<div class="vr"><div class="track"></div><div class="ln"></div></div>`).join('')}</div>`;
    const reels=[...document.querySelectorAll('#vg .vr')];
    const WIN=30,N=38;let maxd=0;const ends=[];
    reels.forEach((r,i)=>{
      const tr=r.querySelector('.track');const w=r.clientWidth,H=r.clientHeight,s=w-10,step=s+6;
      let h='';for(let k=0;k<N;k++){const it=k===WIN?ITEMS[got[i].id]:stripPick(c);h+=`<div class="it">${nftHTML(it)}</div>`}
      tr.innerHTML=h;
      const end=H/2-(WIN*step+s/2)+(Math.random()-.5)*s*.5;ends.push([tr,end]);
      const dur=fast?.9+i*.06:4.2+i*.32;maxd=Math.max(maxd,dur);
      tr.getBoundingClientRect();
      tr.style.transition=`transform ${dur}s cubic-bezier(.07,.5,.1,1)`;tr.style.transform=`translateY(${end}px)`;
      setTimeout(()=>{r.classList.add('win');sfx('tick',200);haptic('medium')},dur*1000);
    });
    let tk=setInterval(()=>{if(!done){sfx('tick',rnd(0,120));haptic('light')}},170);
    skipFn=()=>{clearInterval(tk);ends.forEach(([t,e])=>{t.style.transition='none';t.style.transform=`translateY(${e}px)`})};
    setTimeout(()=>{clearInterval(tk);finish()},maxd*1000+500);
  }
}
function revealOne(c,g,o){

function showResults(c,got,o){

  $('#okeep').onclick=closeOpen;
  const ag=$('#oagain');if(ag)ag.onclick=()=>{o.remove();startOpen(c,q)};

// ===== UPGRADER
const U={sel:[],extra:0,tgt:null,busy:0,rot:0};
function uStake(){return U.sel.reduce((s,u)=>{const x=S.inv.find(i=>i.u===u);return s+(x?ITEMS[x.id].price:0)},0)+U.extra}
function uChance(){const st=uStake();if(!U.tgt&&U.tgt!==0||!st)return 0;const t=ITEMS[U.tgt].price;return Math.max(0,Math.min(95,95*st/t))}
function wheelSVG(ch){return `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="82" fill="none" stroke="#22223a" stroke-width="18"/><circle cx="100" cy="100" r="82" fill="none" stroke="url(#wg)" stroke-width="18" pathLength="100" stroke-dasharray="${ch} ${100-ch}" transform="rotate(-90 100 100)" stroke-linecap="butt"/><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ddc84"/><stop offset="1" stop-color="#19b36b"/></linearGradient></defs><g class="rot" id="rot" style="transform:rotate(${U.rot}deg)"><polygon points="100,4 90,26 110,26" fill="#ffd24a" stroke="#8a5a00" stroke-width="2" stroke-linejoin="round"/><circle cx="100" cy="100" r="64" fill="none"/></g></svg>`}
PAGES.up=function(m){
  U.sel=U.sel.filter(u=>S.inv.some(i=>i.u===u));

  <div class="slot" id="s2">${t?`${nftHTML(t,{noRib:1})}<b class="sm">${t.name}</b><b style="color:var(--gold)">${STAR} ${fmt(t.price)}</b>`:`<div class="plus">?</div><span class="mut sm">Выбери цель</span>`}</div></div>

  m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{U.extra=Math.floor(S.stars*b.dataset.p/100);if(U.tgt!==null&&ITEMS[U.tgt].price<=uStake()*1.01)U.tgt=null;PAGES.up(m)});
  $('#ugo').onclick=doUpgrade;
};
function pickMine(){
  if(!S.inv.length)return toast('На складе пусто');
  const el=sheet('');let sel=new Set(U.sel);
  const draw=()=>{
    const inv=S.inv.slice().sort((a,b)=>ITEMS[b.id].price-ITEMS[a.id].price);
    el.querySelector('.sheet').innerHTML=`<button class="x">✕</button><h1>Твои предметы</h1><div class="grid" style="margin:10px 0">${inv.map(g=>{const it=ITEMS[g.id];return `<div class="cell ${sel.has(g.u)?'sel':''}" data-u="${g.u}">${nftHTML(it)}${sel.has(g.u)?'<div class="tk">✓</div>':''}<div class="nm">${it.name}</div><div class="pr">${STAR}${fmt(it.price)}</div></div>`}).join('')}</div><button class="btn" id="ok" style="width:100%">Готово · ${sel.size}</button>`;
    el.querySelector('.x').onclick=el.close;
    el.querySelector('.grid').onclick=e=>{const c=e.target.closest('.cell');if(!c)return;const u=+c.dataset.u;sel.has(u)?sel.delete(u):sel.add(u);sfx('click');const y=el.querySelector('.sheet').scrollTop;draw();el.querySelector('.sheet').scrollTop=y};

  };draw();
}
function pickTarget(){

function doUpgrade(){
  if(U.busy)return;const st=uStake(),ch=uChance();if(!st||U.tgt===null||ch<=0)return;
  if(U.extra>S.stars)return toast('Не хватает звёзд');
  const t=ITEMS[U.tgt];U.busy=1;
  const lost=U.sel.slice();
  // spend
  U.sel.forEach(u=>{const k=S.inv.findIndex(i=>i.u===u);if(k>=0)S.inv.splice(k,1)});addStars(-U.extra);
  const win=Math.random()*100<ch;
  const arc=ch*3.6;const ang=win?Math.random()*(arc-2)+1:arc+2+Math.random()*(358-arc-2);
  U.rot=((Math.floor(U.rot/360)+5)*360)+ang;
  const r=$('#rot');if(r){r.style.transform=`rotate(${U.rot}deg)`}
  const btn=$('#ugo');if(btn)btn.disabled=true;
  sfx('tick',100);
  S.st.ups++;qAdd('up');addXp(20);
  setTimeout(()=>{
    U.busy=0;
    if(win){S.st.upw++;const g=giveItem(t.id);sfx('big');haptic('success');U.sel=[];U.extra=0;U.tgt=null;save();
      const el=sheet(`<h1 style="color:var(--ok)">Успех!</h1><div style="width:60%;margin:12px auto">${nftHTML(t,{num:g.n})}</div><div style="text-align:center;font-weight:900;margin-bottom:12px">${t.name}<br><span style="color:var(--gold)">${STAR} ${fmt(t.price)}</span></div><button class="btn" id="oo" style="width:100%">Отлично</button>`,()=>PAGES.up($('#main')));
      burst(el.querySelector('.sheet'),TIERS[t.r].c,70);el.querySelector('#oo').onclick=el.close;
    }else{sfx('lose');haptic('error');U.sel=[];U.extra=0;save();toast('Не повезло. Ставка сгорела');PAGES.up($('#main'))}
  },4800);
}

function gCoin(){

  const draw=()=>{
    el.querySelector('.sheet').innerHTML=`<button class="x">✕</button><h1>Монетка</h1><div class="coin" id="coin" style="transform:rotateY(${rot}deg)"><div class="f">★</div><div class="b">☾</div></div>

    <div class="bet"><input id="bi" type="number" inputmode="numeric" value="${bet}"><button class="btn ghost sm" data-m="x2">×2</button><button class="btn ghost sm" data-m="h">½</button><button class="btn ghost sm" data-m="max">MAX</button></div>
    <button class="btn gold" id="go" style="width:100%">Бросить · выигрыш ${fmt(bet*1.95)} ★</button>`;
    el.querySelector('.x').onclick=el.close;

    el.querySelector('#bi').onchange=e=>{bet=Math.max(1,Math.min(S.stars,Math.floor(+e.target.value||1)));draw()};
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(busy)return;bet=b.dataset.m==='x2'?bet*2:b.dataset.m==='h'?Math.max(1,Math.floor(bet/2)):S.stars;bet=Math.max(1,Math.min(S.stars,bet));draw()});
    el.querySelector('#go').onclick=()=>{
      if(busy)return;if(bet<1||bet>S.stars)return toast('Не хватает звёзд');busy=1;addStars(-bet);qAdd('game');
      const win=Math.random()<0.48,res=win?side:1-side;
      rot=(Math.floor(rot/360)+4)*360+(res?180:0);el.querySelector('#coin').style.transform=`rotateY(${rot}deg)`;sfx('tick',200);

    };
